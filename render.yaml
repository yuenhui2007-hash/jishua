services:
  - type: web
    name: yh-backend
    runtime: node
    rootDir: backend-simple
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://yuenhui2007-hash.github.io
      - key: JWT_SECRET
        generateValue: true
