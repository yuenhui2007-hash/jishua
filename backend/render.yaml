# Render.com Blueprint for YH Backend
# This enables one-click deployment to Render.com
# See: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: yh-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://yuenhui2007-hash.github.io
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: BCRYPT_ROUNDS
        value: 12
      - key: DB_PATH
        value: ./data/resumeai.db
      - key: AI_PROVIDER
        value: openai
      - key: RATE_LIMIT_WINDOW
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 100
      - key: AI_RATE_LIMIT_MAX
        value: 20
      - key: LOG_LEVEL
        value: info
      # Add your API keys below after deployment:
      # - key: OPENAI_API_KEY
      #   sync: false
      # - key: ANTHROPIC_API_KEY
      #   sync: false
      # - key: STRIPE_SECRET_KEY
      #   sync: false
