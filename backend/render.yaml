services:
  - type: web
    name: jishua-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: ./data/jishua.json
      - key: ADMIN_EMAIL
        value: admin@jishua.ai
      - key: ADMIN_PASSWORD
        value: admin123
      - key: FRONTEND_URL
        value: https://yuenhui2007-hash.github.io
      - key: OPENAI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_PRO
        sync: false
      - key: STRIPE_PRICE_ID_ENTERPRISE
        sync: false
