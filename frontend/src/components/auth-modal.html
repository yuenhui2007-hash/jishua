<!-- Auth Modal - Login / Register -->
<div class="auth-modal" id="authModal" style="display:none;">
    <div class="auth-overlay" onclick="closeAuthModal()"></div>
    <div class="auth-container">
        <button class="auth-close" onclick="closeAuthModal()"><i class="fas fa-times"></i></button>

        <div class="auth-tabs">
            <button class="auth-tab active" data-tab="login" onclick="switchAuthTab('login')">Sign In</button>
            <button class="auth-tab" data-tab="register" onclick="switchAuthTab('register')">Create Account</button>
        </div>

        <!-- Login Form -->
        <form class="auth-form active" id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required minlength="8">
            </div>
            <button type="submit" class="btn-primary btn-full">
                <span class="btn-text">Sign In</span>
                <span class="btn-loading" style="display:none;"><i class="fas fa-spinner fa-spin"></i></span>
            </button>
            <p class="auth-alt">
                <a href="#" onclick="showForgotPassword()">Forgot password?</a>
            </p>
        </form>

        <!-- Register Form -->
        <form class="auth-form" id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-grid" style="grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" name="firstName" placeholder="John">
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" name="lastName" placeholder="Doe">
                </div>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Min 8 chars, 1 uppercase, 1 number" required minlength="8">
            </div>
            <button type="submit" class="btn-primary btn-full">
                <span class="btn-text">Create Account</span>
                <span class="btn-loading" style="display:none;"><i class="fas fa-spinner fa-spin"></i></span>
            </button>
            <p class="auth-note">By signing up, you agree to our Terms and Privacy Policy</p>
        </form>

        <!-- Forgot Password Form -->
        <form class="auth-form" id="forgotForm" onsubmit="handleForgotPassword(event)">
            <p style="color: var(--text-secondary); margin-bottom: 20px; font-size: 0.9rem;">
                Enter your email and we'll send you a reset link.
            </p>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="you@example.com" required>
            </div>
            <button type="submit" class="btn-primary btn-full">
                <span class="btn-text">Send Reset Link</span>
                <span class="btn-loading" style="display:none;"><i class="fas fa-spinner fa-spin"></i></span>
            </button>
            <p class="auth-alt">
                <a href="#" onclick="switchAuthTab('login')">Back to sign in</a>
            </p>
        </form>

        <div class="auth-message" id="authMessage" style="display:none;"></div>
    </div>
</div>

<style>
.auth-modal {
    position: fixed; inset: 0; z-index: 10000;
    display: flex; align-items: center; justify-content: center;
}
.auth-overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
}
.auth-container {
    position: relative; background: var(--bg-card);
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 40px; width: 100%; max-width: 420px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    animation: authSlideIn 0.3s ease;
}
@keyframes authSlideIn {
    from { opacity: 0; transform: translateY(20px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}
.auth-close {
    position: absolute; top: 16px; right: 16px;
    background: none; border: none; color: var(--text-muted);
    font-size: 1.2rem; cursor: pointer; padding: 8px;
    border-radius: 8px; transition: all 0.3s ease;
}
.auth-close:hover { color: var(--text); background: var(--bg-elevated); }
.auth-tabs {
    display: flex; gap: 4px; margin-bottom: 28px;
    background: var(--bg-elevated); border-radius: 12px; padding: 4px;
}
.auth-tab {
    flex: 1; padding: 10px; border: none; background: none;
    color: var(--text-muted); font-size: 0.9rem; font-weight: 500;
    border-radius: 10px; cursor: pointer; transition: all 0.3s ease;
}
.auth-tab.active { background: var(--accent); color: var(--bg); }
.auth-form { display: none; }
.auth-form.active { display: block; }
.auth-form .form-group { margin-bottom: 16px; }
.auth-form .form-group label {
    display: block; font-size: 0.8rem; font-weight: 500;
    color: var(--text-secondary); margin-bottom: 6px;
}
.auth-form .form-group input {
    width: 100%; padding: 12px 14px;
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-size: 0.9rem;
    transition: all 0.3s ease;
}
.auth-form .form-group input:focus {
    outline: none; border-color: rgba(212,175,55,0.3);
    box-shadow: 0 0 0 3px var(--accent-glow);
}
.auth-form .btn-full { margin-top: 8px; }
.auth-alt {
    text-align: center; margin-top: 16px;
    font-size: 0.85rem; color: var(--text-muted);
}
.auth-alt a { color: var(--accent); text-decoration: none; }
.auth-alt a:hover { text-decoration: underline; }
.auth-note {
    text-align: center; margin-top: 16px;
    font-size: 0.75rem; color: var(--text-muted);
}
.auth-message {
    margin-top: 16px; padding: 12px 16px;
    border-radius: 10px; font-size: 0.85rem;
    text-align: center;
}
.auth-message.success { background: rgba(34,197,94,0.1); color: #22c55e; border: 1px solid rgba(34,197,94,0.2); }
.auth-message.error { background: rgba(239,68,68,0.1); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); }
</style>

<script>
function openAuthModal(tab = 'login') {
    document.getElementById('authModal').style.display = 'flex';
    switchAuthTab(tab);
}

function closeAuthModal() {
    document.getElementById('authModal').style.display = 'none';
    document.getElementById('authMessage').style.display = 'none';
}

function switchAuthTab(tab) {
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    document.querySelectorAll('.auth-form').forEach(f => f.classList.toggle('active', f.id === tab + 'Form'));
    document.getElementById('authMessage').style.display = 'none';
}

function showForgotPassword() {
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
    document.getElementById('forgotForm').classList.add('active');
}

function showAuthMessage(text, type) {
    const msg = document.getElementById('authMessage');
    msg.textContent = text;
    msg.className = 'auth-message ' + type;
    msg.style.display = 'block';
}

function setLoading(formId, loading) {
    const form = document.getElementById(formId);
    form.querySelector('.btn-text').style.display = loading ? 'none' : 'inline';
    form.querySelector('.btn-loading').style.display = loading ? 'inline' : 'none';
    form.querySelector('button[type="submit"]').disabled = loading;
}

async function handleLogin(e) {
    e.preventDefault();
    const formData = new FormData(e.target);
    setLoading('loginForm', true);

    try {
        const result = await API.login({
            email: formData.get('email'),
            password: formData.get('password'),
        });
        showAuthMessage('Welcome back!', 'success');
        setTimeout(() => {
            closeAuthModal();
            updateAuthUI();
        }, 800);
    } catch (error) {
        showAuthMessage(error.message || 'Login failed', 'error');
    } finally {
        setLoading('loginForm', false);
    }
}

async function handleRegister(e) {
    e.preventDefault();
    const formData = new FormData(e.target);
    setLoading('registerForm', true);

    try {
        const result = await API.register({
            email: formData.get('email'),
            password: formData.get('password'),
            firstName: formData.get('firstName'),
            lastName: formData.get('lastName'),
        });
        showAuthMessage('Account created! Welcome!', 'success');
        setTimeout(() => {
            closeAuthModal();
            updateAuthUI();
        }, 800);
    } catch (error) {
        showAuthMessage(error.message || 'Registration failed', 'error');
    } finally {
        setLoading('registerForm', false);
    }
}

async function handleForgotPassword(e) {
    e.preventDefault();
    const formData = new FormData(e.target);
    setLoading('forgotForm', true);

    try {
        await API.forgotPassword(formData.get('email'));
        showAuthMessage('Reset link sent to your email!', 'success');
    } catch (error) {
        showAuthMessage(error.message || 'Request failed', 'error');
    } finally {
        setLoading('forgotForm', false);
    }
}

async function updateAuthUI() {
    const navAuth = document.getElementById('navAuth');
    if (!navAuth) return;

    try {
        const { user } = await API.getMe();
        navAuth.innerHTML = `
            <div class="nav-user">
                <span>${user.first_name || user.email.split('@')[0]}</span>
                <button class="btn-nav" onclick="handleLogout()" style="padding: 8px 16px; font-size: 0.75rem;">Logout</button>
            </div>
        `;
    } catch {
        navAuth.innerHTML = `<button class="btn-nav" onclick="openAuthModal('login')">Sign In</button>`;
    }
}

async function handleLogout() {
    await API.logout();
    updateAuthUI();
    window.location.reload();
}

// Init auth UI on page load
document.addEventListener('DOMContentLoaded', updateAuthUI);
</script>
